[package]
name = "primalschemers"
version = "0.3.0"
edition = "2021"

[lib]
name = "primalschemers"
crate-type = ["cdylib", "lib"]

[dependencies]
rayon = "1.10.0"
indicatif = {version = "*", features = ["rayon"]}
itertools = "0.14.0"
pyo3 = "0.29"
primer3-thal-rs = "0.2"

[dev-dependencies]
criterion = "0.5"

# NOTE: no `panic = "abort"` — PyO3 relies on unwinding to turn Rust panics into
# Python exceptions.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

[[bench]]
name = "dimer_bench"
harness = false
